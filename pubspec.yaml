name: daleel_mustaqbali_app
description: "دليل مستقبلي - المنصة الأكاديمية الذكية للجامعات والمنح والهجرة العالمية وأدوات الطالب."
publish_to: 'none'

version: 3.0.0+40

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.4
  shared_preferences: ^2.3.5
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/daleel_hero_banner.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/daleel_app_logo.png"