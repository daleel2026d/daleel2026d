- name: Sign IPA using Apple Native Tools
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          # 1. فك تشفير الشهادة والملف
          python3 - << 'EOF'
          import os, base64

          cert_b64 = os.environ.get('BUILD_CERTIFICATE_BASE64', '').strip()
          pp_b64 = os.environ.get('BUILD_PROVISION_PROFILE_BASE64', '').strip()

          if not cert_b64 or not pp_b64:
              raise ValueError("BUILD_CERTIFICATE_BASE64 or BUILD_PROVISION_PROFILE_BASE64 secret is missing!")

          with open('cert.p12', 'wb') as f:
              f.write(base64.b64decode(cert_b64))

          with open('embedded.mobileprovision', 'wb') as f:
              f.write(base64.b64decode(pp_b64))

          print("Cert size:", os.path.getsize('cert.p12'), "bytes")
          print("Profile size:", os.path.getsize('embedded.mobileprovision'), "bytes")
          EOF

          # 2. تحديد مسار OpenSSL 3 على الماك وتحويل الشهادة تلقائياً إلى صيغة متوافقة مع macOS Keychain
          if [ -x "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          elif [ -x "/usr/local/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_BIN="/usr/local/opt/openssl@3/bin/openssl"
          else
            OPENSSL_BIN="openssl"
          fi

          echo "Re-exporting certificate using: $OPENSSL_BIN"
          $OPENSSL_BIN pkcs12 -in cert.p12 -nodes -passin pass:"$P12_PASSWORD" -legacy | \
          $OPENSSL_BIN pkcs12 -export -out cert_legacy.p12 -passout pass:"$P12_PASSWORD" -legacy

          # 3. إنشاء وتجهيز Keychain مؤقت
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "temp_pwd" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "temp_pwd" $KEYCHAIN_PATH

          # 4. استيراد الشهادة المحوّلة
          security import cert_legacy.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp_pwd" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 5. التحقق من هوية التوقيع
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "Error: No valid codesigning identity found in certificate. Check P12 password."
            exit 1
          fi
          echo "Signing with Identity: $IDENTITY"

          # 6. دمج ملف التعريف واستخراج الـ Entitlements
          cp embedded.mobileprovision Payload/Runner.app/embedded.mobileprovision
          security cms -D -i embedded.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.plist > entitlements.plist

          # 7. توقيع الفريمووركس إن وجدت
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -name "*.dylib" -o -name "*.framework" 2>/dev/null | while read -r lib; do
              codesign --force --sign "$IDENTITY" --keychain $KEYCHAIN_PATH "$lib"
            done
          fi

          # 8. توقيع التطبيق الرئيسي
          codesign --force --sign "$IDENTITY" --entitlements entitlements.plist --timestamp --generate-entitlement-der --keychain $KEYCHAIN_PATH Payload/Runner.app

          # 9. ضغط الحزمة الموقعة
          zip -r -y daleel-signed.ipa Payload
