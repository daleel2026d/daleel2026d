name: Build Flutter iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable SPM and Precache iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios

      - name: Setup iOS Environment and Missing Files
        run: |
          python3 -c "
          import os, base64

          # 1. انشاء المجلدات
          os.makedirs('ios/Runner.xcodeproj/xcshareddata/xcschemes', exist_ok=True)
          os.makedirs('ios/Runner.xcodeproj/project.xcworkspace', exist_ok=True)
          os.makedirs('ios/Runner.xcworkspace/xcshareddata/xcschemes', exist_ok=True)
          os.makedirs('assets/icon', exist_ok=True)

          # 2. ملفات مساحة العمل Workspace
          ws_inner = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Workspace version=\"1.0\"><FileRef location=\"self:\"></FileRef></Workspace>\n'
          ws_outer = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Workspace version=\"1.0\"><FileRef location=\"group:Runner.xcodeproj\"></FileRef></Workspace>\n'
          with open('ios/Runner.xcodeproj/project.xcworkspace/contents.xcworkspacedata', 'w') as f:
              f.write(ws_inner)
          with open('ios/Runner.xcworkspace/contents.xcworkspacedata', 'w') as f:
              f.write(ws_outer)

          # 3. مخطط Runner Scheme
          scheme_content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <Scheme LastUpgradeVersion=\"1510\" version=\"1.3\">
             <BuildAction parallelizeBuildables=\"YES\" buildImplicitDependencies=\"YES\">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting=\"YES\" buildForRunning=\"YES\" buildForProfiling=\"YES\" buildForArchiving=\"YES\" buildForAnalyzing=\"YES\">
                      <BuildableReference BuildableIdentifier=\"primary\" BlueprintIdentifier=\"97C146ED1CF9000F007C117D\" BuildableName=\"Runner.app\" BlueprintName=\"Runner\" ReferencedContainer=\"container:Runner.xcodeproj\">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <ArchiveAction buildConfiguration=\"Release\" revealArchiveInOrganizer=\"YES\">
             </ArchiveAction>
          </Scheme>'''
          clean_scheme = '\n'.join([line.strip() for line in scheme_content.splitlines() if line.strip()]) + '\n'
          for p in ['ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme', 'ios/Runner.xcworkspace/xcshareddata/xcschemes/Runner.xcscheme']:
              with open(p, 'w') as f:
                  f.write(clean_scheme)

          # 4. ملف ادارة المخططات Plist
          plist_content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict><key>SchemeUserState</key><dict><key>Runner.xcscheme_^#shared#^_</key><dict><key>isShown</key><true/><key>orderHint</key><integer>0</integer></dict></dict></dict>
          </plist>'''
          clean_plist = '\n'.join([line.strip() for line in plist_content.splitlines() if line.strip()]) + '\n'
          for p in ['ios/Runner.xcodeproj/xcshareddata/xcschemes/xcschememanagement.plist', 'ios/Runner.xcworkspace/xcshareddata/xcschemes/xcschememanagement.plist']:
              with open(p, 'w') as f:
                  f.write(clean_plist)

          # 5. انشاء Podfile تلقائيا اذا لم يكن موجودا
          podfile_path = 'ios/Podfile'
          if not os.path.exists(podfile_path):
              podfile_b64 = ''
              with open(podfile_path, 'wb') as f:
                  f.write(base64.b64decode(podfile_b64))

          # 6. انشاء صورة احتياطية اذا كانت مفقودة
          icon_path = 'assets/icon/app_icon.png'
          if not os.path.exists(icon_path):
              icon_b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
              with open(icon_path, 'wb') as f:
                  f.write(base64.b64decode(icon_b64))

          print('All setup executed cleanly without errors!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Project & Team ID
        run: |
          python3 -c "
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(p, 'r') as f: c = f.read()
          c = c.replace('com.uni_guide_app', 'com.omar.uniguide')
          c = c.replace('DEVELOPMENT_TEAM = \"\";', 'DEVELOPMENT_TEAM = 48Z9H342HM;')
          if 'DEVELOPMENT_TEAM = 48Z9H342HM;' not in c:
              c = c.replace('PRODUCT_BUNDLE_IDENTIFIER = com.omar.uniguide;', 'PRODUCT_BUNDLE_IDENTIFIER = com.omar.uniguide;\n\t\t\t\tDEVELOPMENT_TEAM = 48Z9H342HM;')
          with open(p, 'w') as f: f.write(c)
          "
          xcodebuild -list -workspace ios/Runner.xcworkspace

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Fix Info.plist & Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          plutil -insert UISupportedInterfaceOrientations -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist" || plutil -replace UISupportedInterfaceOrientations -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist"
          
          plutil -insert "UISupportedInterfaceOrientations~ipad" -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist" || plutil -replace "UISupportedInterfaceOrientations~ipad" -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist"
          
          plutil -replace UIRequiresFullScreen -bool YES "$APP_PATH/Info.plist" || plutil -insert UIRequiresFullScreen -bool YES "$APP_PATH/Info.plist"
          
          cp -r "$APP_PATH" Payload/
          zip -r -y daleel-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-unsigned-ipa
          path: daleel-unsigned.ipa
