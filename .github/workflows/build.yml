name: Build Flutter iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Missing Xcode Scheme
        run: |
          mkdir -p ios/Runner.xcodeproj/xcshareddata/xcschemes
          RUNNER_ID=$(grep -E '[A-F0-9]{24} /\* Runner \*/ = \{' ios/Runner.xcodeproj/project.pbxproj | awk '{print $1}' | head -n 1)
          if [ -z "$RUNNER_ID" ]; then RUNNER_ID="97C146ED1CF9000F007C117D"; fi
          echo "Using Runner Target ID: $RUNNER_ID"
          
          cat << 'EOF' > ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1510"
             version = "1.3">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "TARGET_ID_HERE"
                         BuildableName = "Runner.app"
                         BlueprintName = "Runner"
                         ReferencedContainer = "container:Runner.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">
                <Testables>
                </Testables>
             </TestAction>
             <LaunchAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "TARGET_ID_HERE"
                      BuildableName = "Runner.app"
                      BlueprintName = "Runner"
                      ReferencedContainer = "container:Runner.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Profile"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "TARGET_ID_HERE"
                      BuildableName = "Runner.app"
                      BlueprintName = "Runner"
                      ReferencedContainer = "container:Runner.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF
          sed -i '' "s/TARGET_ID_HERE/$RUNNER_ID/g" ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          echo "Scheme created successfully!"

      - name: Install Dependencies
        run: flutter pub get

      - name: Update Bundle ID
        run: |
          find ios -name "project.pbxproj" -exec sed -i '' 's/com.uni_guide_app/com.omar.uniguide/g' {} +

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Fix Info.plist & Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          plutil -insert UISupportedInterfaceOrientations -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist" || plutil -replace UISupportedInterfaceOrientations -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist"
          
          plutil -insert "UISupportedInterfaceOrientations~ipad" -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist" || plutil -replace "UISupportedInterfaceOrientations~ipad" -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$APP_PATH/Info.plist"
          
          plutil -replace UIRequiresFullScreen -bool YES "$APP_PATH/Info.plist" || plutil -insert UIRequiresFullScreen -bool YES "$APP_PATH/Info.plist"
          
          cp -r "$APP_PATH" Payload/
          zip -r -y daleel-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daleel-unsigned-ipa
          path: daleel-unsigned.ipa
